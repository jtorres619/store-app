name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

      - name: Build users service
        run: go build ./cmd/users-service

      - name: Build orders service
        run: go build ./cmd/orders-service

      - name: Build products service
        run: go build ./cmd/products-service