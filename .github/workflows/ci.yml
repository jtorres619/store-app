name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::347288885928:role/GitHubActions-StoreApp-ECR-Publisher
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

      - name: Build and push users-service image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg SERVICE_NAME=users-service \
            -t $REGISTRY/store-app/users-service:$IMAGE_TAG .

          docker push $REGISTRY/store-app/users-service:$IMAGE_TAG

      - name: Build and push orders-service image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg SERVICE_NAME=orders-service \
            -t $REGISTRY/store-app/orders-service:$IMAGE_TAG .

          docker push $REGISTRY/store-app/orders-service:$IMAGE_TAG

      - name: Build and push products-service image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg SERVICE_NAME=products-service \
            -t $REGISTRY/store-app/products-service:$IMAGE_TAG .

          docker push $REGISTRY/store-app/products-service:$IMAGE_TAG