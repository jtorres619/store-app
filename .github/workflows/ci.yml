name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::347288885928:role/GitHubActions-StoreApp-ECR-Publisher
          aws-region: us-east-1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

      - name: Build users service
        run: go build ./cmd/users-service

      - name: Build orders service
        run: go build ./cmd/orders-service

      - name: Build products service
        run: go build ./cmd/products-service

      - name: Build users Docker image
        run: |
          docker build \
            --build-arg SERVICE_NAME=users-service \
            -t users-service:${{ github.sha }} .

      - name: Build orders Docker image
        run: |
          docker build \
            --build-arg SERVICE_NAME=orders-service \
            -t orders-service:${{ github.sha }} .

      - name: Build products Docker image
        run: |
          docker build \
            --build-arg SERVICE_NAME=products-service \
            -t products-service:${{ github.sha }} .
